<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <p id="demo"></p>
  <script >
    let i=1;
    let result="";
    do{
        if(i==4)
        result+=(2*i)+"<br>";
        i++;
    }
    while(i<=10);
    document.write(result);
  </script>  
</body>
</html>
